name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: VixHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            cat > keystore.properties << EOF
          storeFile=../release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          else
            echo "No keystore secrets — debug unsigned/local"
          fi

      - run: chmod +x ./gradlew
      - name: Build
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon
            APK=app/build/outputs/apk/release/app-release.apk
          else
            ./gradlew assembleDebug --stacktrace --no-daemon
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          VERSION=$(grep versionName app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          CODE=$(grep versionCode app/build.gradle.kts | head -1 | sed 's/[^0-9]//g')
          NAME="VixHub-${VERSION}.apk"
          cp "$APK" "$NAME"
          echo "APK_NAME=$NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "CODE=$CODE" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: VixHub-${{ env.VERSION }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.CODE }}
          name: VixHub ${{ env.VERSION }}
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
