name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - run: chmod +x ./gradlew

      - name: Build signed release
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon
          VERSION=$(grep versionName app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          CODE=$(grep versionCode app/build.gradle.kts | head -1 | sed 's/[^0-9]//g')
          SRC=app/build/outputs/apk/release/app-release.apk
          NAME="VixHub-${VERSION}.apk"
          cp "$SRC" "$NAME"
          echo "APK_NAME=$NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "CODE=$CODE" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: VixHub-${{ env.VERSION }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: GitHub Release
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.CODE }}
          name: VixHub ${{ env.VERSION }}
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
